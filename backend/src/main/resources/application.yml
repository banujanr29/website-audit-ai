server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: website-audit-ai
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Website Audit AI
    version: 0.0.1-SNAPSHOT
    description: AI-powered Website Audit Tool

# Logging
logging:
  level:
    root: INFO
    com.eight25.audit: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CORS allowed origins (override per environment)
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

#GEMINI
gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
